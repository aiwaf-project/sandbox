    environment:
      AIWAF_REDIS_URL: redis://redis:6379/9
      AIWAF_RATE_CACHE_KEY_PREFIX: "sandbox:flask:rate:"
      AIWAF_RATE_CACHE_BACKEND: redis
      TARGET_BASE_URL: http://juice:3000
      PORT: 3010
      AIWAF_LOG_DIR: /logs
      AIWAF_LOG_FORMAT: json
      AIWAF_MIN_AI_LOGS: "10000"
      AIWAF_FORCE_AI: "false"
      AIWAF_USE_RUST: "true"
    depends_on:
      redis:
        condition: service_healthy
      juice:
        condition: service_started
    volumes:
      - aiwaf_logs:/logs

