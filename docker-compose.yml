x-aiwaf-source: &aiwaf-source https://github.com/aayushgauba/aiwaf.git#843a35f4fd48b4ef565e3c1ec8a42db9b1c41946

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - redis_data:/data

  juice:
    image: bkimminich/juice-shop
    container_name: juice_shop_all
    restart: unless-stopped
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "require('http').get('http://localhost:3000', r => process.exit(r.statusCode >= 200 && r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

  aiwaf-django:
    build:
      additional_contexts:
        aiwaf_source: *aiwaf-source
      context: .
      dockerfile: examples/sandbox/aiwaf-django-proxy/Dockerfile
    container_name: aiwaf_django_proxy_all
    ports:
      - "3009:3009"
    environment:
      AIWAF_REDIS_URL: redis://redis:6379/8
      AIWAF_RATE_CACHE_KEY_PREFIX: "sandbox:django:rate:"
      AIWAF_RATE_CACHE_BACKEND: redis
      TARGET_BASE_URL: http://juice:3000
      PORT: 3009
      AIWAF_GEO_BLOCK_ENABLED: "false"
      AIWAF_CLEAR_STATE_ON_START: "false"
      AIWAF_MIN_AI_LOGS: "10000"
      AIWAF_DISABLE_AI: "true"
      AIWAF_USE_RUST: "true"
      AIWAF_MIDDLEWARE_LOGGING: "true"
      AIWAF_MIDDLEWARE_LOG: /logs/aiwaf-requests.log
      AIWAF_MIDDLEWARE_CSV: "true"
      AIWAF_MIDDLEWARE_DB: "false"
      AIWAF_WASM_HEADER_VALIDATION: "false"
      AIWAF_DEBUG_WASM_HEADERS: "true"
      AIWAF_DEBUG_HEADERS: "true"
    depends_on:
      redis:
        condition: service_healthy
      juice:
        condition: service_started
    volumes:
      - aiwaf_logs:/logs

  aiwaf-flask:
    build:
      additional_contexts:
        aiwaf_source: *aiwaf-source
      context: .
      dockerfile: examples/sandbox/aiwaf-flask-proxy/Dockerfile
