    profiles: [assessment]
    build:
      context: .
      dockerfile: examples/sandbox/assessment/Dockerfile
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      AIWAF_ASSESSMENT_TOKEN: ${AIWAF_ASSESSMENT_TOKEN:-sandbox-assessment-only}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=2)"]
