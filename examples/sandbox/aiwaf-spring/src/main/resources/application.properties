aiwaf.rate-limit.flood-threshold=${AIWAF_RATE_FLOOD:40}
sandbox.trusted-proxy-cidrs=${AIWAF_SANDBOX_TRUSTED_PROXY_CIDRS:172.16.0.0/12}
