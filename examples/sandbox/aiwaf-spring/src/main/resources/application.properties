server.port=${PORT:8081}
aiwaf.target-base-url=${TARGET_BASE_URL:http://localhost:3000}
aiwaf.geo.enabled=${AIWAF_GEO_BLOCK_ENABLED:false}
aiwaf.ai.enabled=${AIWAF_AI_ENABLED:false}
aiwaf.rate-limit.window-seconds=${AIWAF_RATE_WINDOW_SECONDS:10}
