services:
  aiwaf-java:
    build:
      context: ../..
      dockerfile: examples/sandbox/aiwaf-java/Dockerfile
      no_cache: true
    container_name: aiwaf-java-proxy
    ports:
      - "8080:8080"
    environment:
      TARGET_BASE_URL: http://juice:3000
      PORT: 8080

  aiwaf-java-r:
    build:
      context: ../..
      dockerfile: examples/sandbox/aiwaf-java-r/Dockerfile
      no_cache: true
    container_name: aiwaf-java-r-proxy
    ports:
      - "8082:8082"
    environment:
      TARGET_BASE_URL: http://juice:3000
      PORT: 8082

  aiwaf-spring:
    build:
      context: ../..
      dockerfile: examples/sandbox/aiwaf-spring/Dockerfile
      no_cache: true
    container_name: aiwaf-spring-proxy
    ports:
      - "8081:8081"
    environment:
      TARGET_BASE_URL: http://juice:3000
      PORT: 8081

  aiwaf-spring-r:
    build:
      context: ../..
      dockerfile: examples/sandbox/aiwaf-spring-r/Dockerfile
      no_cache: true
    container_name: aiwaf-spring-r-proxy
    ports:
      - "8083:8083"
    environment:
      TARGET_BASE_URL: http://juice:3000
      PORT: 8083

  juice:
    image: bkimminich/juice-shop
    container_name: juice_shop
    ports:
      - "3001:3000"
